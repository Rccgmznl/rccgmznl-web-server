name: rccgmznl

services:
  traefik:
      image: traefik:latest
      ports:
        - 80:80
        - 443:443
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
        - "/home/ubuntu/app/traefik-certificates:/certificates"
        -  "/home/ubuntu/app/traefik-config/traefik.toml:/etc/traefik/traefik.toml"
        - "/home/ubuntu/app/traefik-config/tls.yml:/etc/traefik/tls.yml"
        - "/var/log/traefik:/logs"
      labels:
        - "traefik.enable=true"
      networks:
        - rccgmznl
      restart: always
  db:
    image: postgres:15
    platform: linux/amd64
    container_name: rccgmznl-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rccgmznl
  backend:
    image:  esanolad/rccgmznl-web-backend:latest
    container_name: rccgmznl-backend
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    # command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0,backend,api.webdev.rccgmountzionnl.org}
      OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL:-https://api.webdev.rccgmountzionnl.org}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://webdev.rccgmountzionnl.org}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://api.webdev.rccgmountzionnl.org,https://webdev.rccgmountzionnl.org,http://localhost:3000,http://127.0.0.1:3000}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-false}
          
    networks:
      - rccgmznl
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/', timeout=5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-web.rule=Host(`api.webdev.rccgmountzionnl.org`)"
      - "traefik.http.routers.backend-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-web.entrypoints=websecure"
      - "traefik.http.routers.backend-web.tls=true"
      - "traefik.http.middlewares.redirectscheme.redirectscheme.scheme=https"
  # React Frontend
  frontend:
    image: esanolad/rccgmznl-web-frontend:latest
    container_name: rccgmznl-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rccgmznl
    #healthcheck:
     # test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      #interval: 10s
      #timeout: 5s
      #retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-web.rule=Host(`webdev.rccgmountzionnl.org`)"
      - "traefik.http.routers.frontend-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-web.entrypoints=websecure"
      - "traefik.http.routers.frontend-web.tls=true"
      - "traefik.http.middlewares.redirectscheme.redirectscheme.scheme=https"
volumes:
  postgres_data:
networks:
  rccgmznl:
    driver: bridge